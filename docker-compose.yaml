services:
    server:
        build:
            context: .
            dockerfile: server/Dockerfile
        restart: unless-stopped
        ports:
            - '3000:3000'
        env_file:
            - ./server/.env
        environment:
            # Reach Garage over the internal compose network (overrides the host value in .env).
            - GARAGE_ENDPOINT=http://garage:3900
        depends_on:
            - garage

    garage:
        image: dxflrs/garage:v1.0.1
        restart: unless-stopped
        # S3 API is bound to localhost on the host so host-run dev servers can reach it,
        # without exposing the object store publicly.
        ports:
            - '127.0.0.1:3900:3900'
        volumes:
            - ./garage.toml:/etc/garage.toml:ro
            - garage_meta:/var/lib/garage/meta
            - garage_data:/var/lib/garage/data

volumes:
    garage_meta:
    garage_data:
